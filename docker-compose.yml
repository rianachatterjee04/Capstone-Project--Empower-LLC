services:
  postgres:
    image: postgres:16-alpine
    container_name: empower-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # <--- Ensures the DB is fully ready before others start
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./apps/backend
    container_name: empower-backend
    volumes:
      - ./apps/backend:/app  # <--- CRITICAL: Maps code into container
    env_file:
      - ./apps/backend/.env
    depends_on:
      postgres:
        condition: service_healthy # <--- Backend waits for Postgres to be 'ready'
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres

  orchestrator:
    build: ./apps/ai-orchestrator/ai-orchestrator-fixed
    container_name: empower-orchestrator
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_AI_SHARED_SECRET: dev-internal-secret

volumes:
  pgdata:
